services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - beautyconnect_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the shell}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the shell}@mongo:27017/beautyconnect?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the shell}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the shell}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - beautyconnect_net
    restart: unless-stopped

  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the shell}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the shell}
      MONGO_INITDB_DATABASE: beautyconnect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/admin"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - beautyconnect_net

volumes:
  mongo_data:

networks:
  beautyconnect_net:
    driver: bridge
