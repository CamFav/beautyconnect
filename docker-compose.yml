services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    networks:
      - beautyconnect_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/beautyconnect
      JWT_SECRET: ${JWT_SECRET:-local_development_secret_replace_before_deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - beautyconnect_net

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: beautyconnect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok", "localhost:27017/test"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - beautyconnect_net

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  beautyconnect_net:
    driver: bridge
